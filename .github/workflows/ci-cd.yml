name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub

jobs:
  # Build and test backend
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: edunovam_test
          MYSQL_USER: edunovam_user
          MYSQL_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, fileinfo, json, mbstring, pdo, pdo_mysql, tokenizer
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Prepare Application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate Swagger
        run: php artisan l5-swagger:generate

      - name: Run PHP Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: edunovam_test
          DB_USERNAME: edunovam_user
          DB_PASSWORD: password
        run: |
          php artisan migrate --force
          ./vendor/bin/pest

  deploy:
    needs: backend
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to DirectAdmin via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CLE_DEPLOIEMENT }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          REMOTE_PORT: ${{ secrets.PORT || '22' }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "./"
          TARGET: "/domains/api.edunova.mg/public_html/"
          EXCLUDE: "/.git/, /.github/, /tests/, /.env"

      - name: Execute remote commands after deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.CLE_DEPLOIEMENT }}
          port: ${{ secrets.PORT || '22' }}
          script: |
            cd /domains/api.edunova.mg/public_html/
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan l5-swagger:generate
